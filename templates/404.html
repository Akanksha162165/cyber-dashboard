<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .error-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 40px;
    }
    .error-code {
      font-size: 120px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 0 0 40px rgba(0,229,255,0.3);
    }
    .error-title {
      font-size: 24px;
      color: var(--text-main);
      margin-bottom: 12px;
    }
    .error-msg {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
    }
    .error-btn {
      background: var(--accent);
      color: #000;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: opacity .2s;
    }
    .error-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <span class="logo">🛡️ CTID</span>
      <span class="logo-full">Cyber Threat Intelligence Dashboard</span>
    </div>
  </header>

  <div class="error-wrap">
    <div class="error-code">404</div>
    <div class="error-title">Page Not Found</div>
    <div class="error-msg">The page you're looking for doesn't exist or has been moved.</div>
    <a href="/" class="error-btn">← Back to Dashboard</a>
  </div>

  <footer class="footer">
    Cyber Threat Intelligence Dashboard — Final Year Project
  </footer>
</body>
</html>
